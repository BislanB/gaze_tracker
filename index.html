<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gaze Guard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
  :root{--bg:#08080d;--surface:#101018;--border:#1c1c2c;--green:#00e676;--red:#ff1744;--yellow:#ffd600;--text:#d8d8e8;--muted:#555568;--cyan:#00e5ff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100dvh;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  header{width:100%;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .logo{font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .eye-icon{width:26px;height:26px;border:2px solid var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .3s}
  .eye-icon .pupil{width:8px;height:8px;background:var(--muted);border-radius:50%;transition:background .3s}
  .badge{padding:5px 14px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--muted);color:var(--muted);transition:all .3s;white-space:nowrap}
  body.looking .eye-icon{border-color:var(--green)}body.looking .eye-icon .pupil{background:var(--green)}
  body.looking .badge{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(0,230,118,.12)}
  body.away .eye-icon{border-color:var(--red)}body.away .eye-icon .pupil{background:var(--red)}
  body.away .badge{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(255,23,68,.15);animation:pr 1s infinite}
  @keyframes pr{50%{box-shadow:0 0 26px rgba(255,23,68,.3)}}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:18px;width:100%;max-width:660px}
  .vw{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:2px solid var(--border);background:var(--surface);transition:border-color .3s,box-shadow .3s}
  body.looking .vw{border-color:var(--green);box-shadow:0 0 28px rgba(0,230,118,.07)}
  body.away .vw{border-color:var(--red);box-shadow:0 0 28px rgba(255,23,68,.1);animation:bp 1s infinite}
  @keyframes bp{50%{box-shadow:0 0 46px rgba(255,23,68,.2)}}
  video,.vw canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}.vw canvas{transform:scaleX(-1);pointer-events:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:13px;color:var(--muted);line-height:1.7;z-index:2;background:var(--surface);transition:opacity .4s}
  .ov.h{opacity:0;pointer-events:none}
  .sp{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gd{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border:2px solid var(--border);z-index:3;transition:border-color .3s}
  body.looking .gd{border-color:var(--green)}body.away .gd{border-color:var(--red);animation:sh .4s infinite}
  @keyframes sh{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .cal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;background:rgba(8,8,13,.85);backdrop-filter:blur(4px);text-align:center;transition:opacity .4s}
  .cal.h{opacity:0;pointer-events:none}
  .cal .ring{width:80px;height:80px;border:3px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
  .cal .ring svg{position:absolute;top:-3px;left:-3px;width:86px;height:86px;transform:rotate(-90deg)}
  .cal .ring svg circle{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .15s}
  .cal .ring .dot{width:14px;height:14px;background:var(--cyan);border-radius:50%}
  .cal .txt{font-size:14px;color:var(--cyan);margin-bottom:8px}
  .cal .sub{font-size:11px;color:var(--muted);max-width:280px;line-height:1.5}
  .cal .skip-btn{margin-top:14px;padding:8px 18px;border-radius:8px;border:1px solid var(--muted);background:transparent;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer}
  .dbg-panel{position:absolute;top:10px;left:10px;font-size:9px;color:var(--cyan);z-index:4;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;pointer-events:none;display:none;line-height:1.6;max-width:280px}
  .ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;padding:11px 22px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none}
  button:active{transform:scale(.96)}button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
  .sr{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%}
  .sr label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);white-space:nowrap}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--green);cursor:pointer}
  .svl{font-size:13px;font-weight:700;color:var(--green);min-width:24px;text-align:right}
  .sts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
  .st{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center}
  .st .l{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px}
  .st .v{font-size:22px;font-weight:700}.st .v.g{color:var(--green)}.st .v.r{color:var(--red)}.st .v.y{color:var(--yellow)}
  .eb{background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.25);border-radius:10px;padding:14px 16px;font-size:11px;color:var(--red);line-height:1.6;width:100%;display:none;word-break:break-word}
  .log{font-size:10px;color:var(--muted);text-align:center;min-height:14px;line-height:1.4}
  footer{padding:14px;text-align:center;font-size:10px;color:var(--muted);border-top:1px solid var(--border);width:100%}
  @media(max-width:500px){header{padding:10px 12px}.logo{font-size:12px;gap:7px}.eye-icon{width:22px;height:22px}.eye-icon .pupil{width:6px;height:6px}.badge{font-size:9px;padding:4px 10px}main{padding:12px 10px;gap:12px}.st .v{font-size:18px}.st .l{font-size:8px}.st{padding:10px 5px}button{padding:10px 16px;font-size:12px}.sr{padding:10px 12px;gap:8px}.sr label{font-size:9px}.gd{width:32px;height:32px;font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="eye-icon"><div class="pupil"></div></div>GAZE GUARD</div>
  <div class="badge" id="badge">ОЖИДАНИЕ</div>
</header>
<main>
  <div class="vw">
    <video id="vid" autoplay muted playsinline></video>
    <canvas id="cvs"></canvas>
    <div class="ov" id="ov"><div class="sp" id="sp"></div><div id="mt">Загрузка…</div></div>
    <div class="cal h" id="cal">
      <div class="ring"><svg viewBox="0 0 86 86"><circle id="calCircle" cx="43" cy="43" r="40" stroke-dasharray="251" stroke-dashoffset="251"/></svg><div class="dot"></div></div>
      <div class="txt">Смотрите в камеру</div>
      <div class="sub" id="calSub">Ожидание…</div>
      <button class="skip-btn" id="calSkip">Пропустить</button>
    </div>
    <div class="gd" id="gd">👁️</div>
    <div class="dbg-panel" id="dbgP"></div>
  </div>
  <div class="eb" id="eb"></div>
  <div class="log" id="log"></div>
  <div class="ctrls">
    <button id="go" disabled style="opacity:.4">▶ Начать</button>
    <button id="no" style="display:none">⏹ Стоп</button>
    <button id="dbgBtn">🔍 Отладка</button>
    <button id="recal" style="display:none">🎯 Калибровка</button>
  </div>
  <div class="sr"><label>Чувствит.</label><input type="range" id="sens" min="1" max="50" value="15"><span class="svl" id="sv">15</span></div>
  <div class="sr"><label>Громкость</label><input type="range" id="vol" min="0" max="100" value="50"><span class="svl" id="vv">50%</span></div>
  <div class="sts">
    <div class="st"><div class="l">Смотрит</div><div class="v g" id="sT">0:00</div></div>
    <div class="st"><div class="l">Отвлечений</div><div class="v r" id="sD">0</div></div>
    <div class="st"><div class="l">Фокус</div><div class="v y" id="sF">—</div></div>
  </div>
</main>
<footer>Gaze Guard · MediaPipe FaceMesh + Iris · Данные локально</footer>

<script type="module">
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs';

/* ── DOM refs ── */
var vid=document.getElementById('vid'),cvs=document.getElementById('cvs'),c=cvs.getContext('2d');
var ov=document.getElementById('ov'),mt=document.getElementById('mt'),sp=document.getElementById('sp');
var gd=document.getElementById('gd'),bdg=document.getElementById('badge');
var goB=document.getElementById('go'),noB=document.getElementById('no');
var dbgB=document.getElementById('dbgBtn'),recalB=document.getElementById('recal');
var sensE=document.getElementById('sens'),svE=document.getElementById('sv');
var volE=document.getElementById('vol'),vvE=document.getElementById('vv');
var eb=document.getElementById('eb'),logE=document.getElementById('log'),dbgP=document.getElementById('dbgP');
var calOv=document.getElementById('cal'),calSub=document.getElementById('calSub');
var calCircle=document.getElementById('calCircle'),calSkip=document.getElementById('calSkip');

/* ── State ── */
var faceLandmarker=null,running=false,audioCtx=null,showDebug=false;
var lookSec=0,totalSec=0,distN=0,wasLook=true,beepCD=0,statsIv=null;
var gazeBuf=[],BUF=7;
var CAL_NEED=20,calibrating=false,calSamples=[];
var baseline={irisLX:0.5,irisLY:0.5,irisRX:0.5,irisRY:0.5,earRatio:1,noseOff:0,calibrated:false};
var lastTs=-1;

/* ── FaceMesh landmark indices ── */
/* Iris centres: left eye iris = 468, right eye iris = 473 */
var IRIS_L=468, IRIS_R=473;
/* Left eye contour corners: inner=133, outer=33 */
var L_EYE_IN=133, L_EYE_OUT=33, L_EYE_TOP=159, L_EYE_BOT=145;
/* Right eye contour corners: inner=362, outer=263 */
var R_EYE_IN=362, R_EYE_OUT=263, R_EYE_TOP=386, R_EYE_BOT=374;
/* Ear-level points for head turn */
var L_CHEEK=234, R_CHEEK=454;
/* Nose tip */
var NOSE_TIP=1;
/* Eye midpoint approximation */
var L_EYE_MID=468, R_EYE_MID=473;

/* Left eye upper/lower lid landmarks for EAR */
var L_LID_UP=[159,158,157,173], L_LID_DN=[145,153,154,163];
/* Right eye upper/lower lid landmarks for EAR */
var R_LID_UP=[386,385,384,398], R_LID_DN=[374,380,381,382];

/* ── Event listeners ── */
goB.addEventListener('click',startTracking);
noB.addEventListener('click',stopTracking);
recalB.addEventListener('click',startCal);
calSkip.addEventListener('click',skipCal);
dbgB.addEventListener('click',function(){showDebug=!showDebug;dbgP.style.display=showDebug?'block':'none';dbgB.classList.toggle('on',showDebug)});
sensE.addEventListener('input',function(){svE.textContent=sensE.value});
volE.addEventListener('input',function(){vvE.textContent=volE.value+'%'});

function log(m){logE.textContent=m}
function showErr(m){eb.textContent=m;eb.style.display='block'}
function hideErr(){eb.style.display='none'}

function beep(){
  var v=parseInt(volE.value);
  if(!v)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='square';o.frequency.value=880;g.gain.value=v/250;
    o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+.18);
    o.stop(audioCtx.currentTime+.18);
  }catch(e){}
}

/* ── Init MediaPipe ── */
async function initFaceLandmarker(){
  mt.innerHTML='Загрузка MediaPipe…';sp.style.display='block';
  log('Загрузка WASM…');
  try{
    var filesetResolver=await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm'
    );
    log('WASM ✓ Загрузка модели…');
    /* Try GPU first, fallback to CPU */
    var delegates=['GPU','CPU'];
    for(var di=0;di<delegates.length;di++){
      try{
        faceLandmarker=await FaceLandmarker.createFromOptions(filesetResolver,{
          baseOptions:{
            modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate:delegates[di]
          },
          outputFaceBlendshapes:true,
          outputFacialTransformationMatrixes:false,
          runningMode:'VIDEO',
          numFaces:1
        });
        log('Модель ✓ ('+delegates[di]+')');
        break;
      }catch(delErr){
        if(di===delegates.length-1)throw delErr;
        log('GPU недоступен, пробую CPU…');
      }
    }
    sp.style.display='none';
    mt.innerHTML='Нажмите «Начать»';
    goB.disabled=false;goB.style.opacity='1';
  }catch(e){
    sp.style.display='none';
    mt.innerHTML='Ошибка загрузки';
    showErr('Не удалось загрузить MediaPipe: '+e.message);
    log('Ошибка: '+e.message);
  }
}
initFaceLandmarker();

/* ── Iris position relative to eye contour ── */
function irisRelative(lm, irisIdx, innerIdx, outerIdx, topIdx, botIdx){
  var iris=lm[irisIdx], inner=lm[innerIdx], outer=lm[outerIdx];
  var top=lm[topIdx], bot=lm[botIdx];
  /* Horizontal: 0=inner corner, 1=outer corner */
  var dx=outer.x-inner.x, dy=outer.y-inner.y;
  var len=Math.sqrt(dx*dx+dy*dy);
  if(len<0.001)return{x:0.5,y:0.5};
  var px=iris.x-inner.x, py=iris.y-inner.y;
  var hPos=(px*dx+py*dy)/(len*len);
  /* Vertical: 0=top, 1=bottom */
  var vdx=bot.x-top.x, vdy=bot.y-top.y;
  var vlen=Math.sqrt(vdx*vdx+vdy*vdy);
  if(vlen<0.001)return{x:hPos,y:0.5};
  var vpx=iris.x-top.x, vpy=iris.y-top.y;
  var vPos=(vpx*vdx+vpy*vdy)/(vlen*vlen);
  return{x:hPos,y:vPos};
}

/* ── Eye Aspect Ratio (EAR) for blink detection ── */
function eyeAR(lm, upIdxs, dnIdxs, innerIdx, outerIdx){
  var inner=lm[innerIdx], outer=lm[outerIdx];
  var hDist=Math.hypot(outer.x-inner.x, outer.y-inner.y);
  if(hDist<0.001)return 0.3;
  var vSum=0;
  for(var i=0;i<upIdxs.length;i++){
    vSum+=Math.hypot(lm[upIdxs[i]].x-lm[dnIdxs[i]].x, lm[upIdxs[i]].y-lm[dnIdxs[i]].y);
  }
  return(vSum/upIdxs.length)/hDist;
}

/* ── Start tracking ── */
async function startTracking(){
  if(!faceLandmarker){showErr('FaceMesh не загружен');return}
  hideErr();goB.style.display='none';sp.style.display='block';mt.innerHTML='Камера…';log('Камера…');
  try{
    var stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false
    });
    vid.srcObject=stream;
    await new Promise(function(res,rej){
      vid.onloadedmetadata=function(){vid.play().then(res).catch(rej)};
      setTimeout(function(){rej(new Error('Камера не ответила'))},15000);
    });
    cvs.width=vid.videoWidth;cvs.height=vid.videoHeight;
    log('Камера '+vid.videoWidth+'x'+vid.videoHeight+' ✓');
    await new Promise(function(r){setTimeout(r,500)});
    ov.classList.add('h');gd.style.display='flex';noB.style.display='';recalB.style.display='';
    running=true;lookSec=0;totalSec=0;distN=0;wasLook=true;gazeBuf=[];lastTs=-1;
    if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
    loop();startCal();
  }catch(e){
    sp.style.display='none';mt.innerHTML='Ошибка';
    showErr(e.message||String(e));goB.style.display='';
  }
}

/* ── Calibration ── */
function startCal(){
  calibrating=true;calSamples=[];baseline.calibrated=false;
  calOv.classList.remove('h');
  calCircle.setAttribute('stroke-dashoffset','251');
  calSub.textContent='Ожидание лица…';
}
function skipCal(){
  calibrating=false;baseline.calibrated=false;
  calOv.classList.add('h');log('Стандартные значения');startStats();
}
function addCal(s){
  calSamples.push(s);
  var pct=Math.min(calSamples.length/CAL_NEED,1);
  calCircle.setAttribute('stroke-dashoffset',String(Math.round(251*(1-pct))));
  calSub.textContent='Сбор: '+calSamples.length+'/'+CAL_NEED;
  if(calSamples.length>=CAL_NEED)finishCal();
}
function finishCal(){
  calibrating=false;calOv.classList.add('h');
  if(calSamples.length<3){baseline.calibrated=false;startStats();return}
  function med(a){var s=a.slice().sort(function(x,y){return x-y});var m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
  baseline.irisLX=med(calSamples.map(function(s){return s.ilx}));
  baseline.irisLY=med(calSamples.map(function(s){return s.ily}));
  baseline.irisRX=med(calSamples.map(function(s){return s.irx}));
  baseline.irisRY=med(calSamples.map(function(s){return s.iry}));
  baseline.noseOff=med(calSamples.map(function(s){return s.no}));
  baseline.earRatio=med(calSamples.map(function(s){return s.er}));
  baseline.calibrated=true;
  log('Калибровка ✓ ILX:'+baseline.irisLX.toFixed(3)+' IRX:'+baseline.irisRX.toFixed(3));
  startStats();
}
function startStats(){
  if(statsIv)clearInterval(statsIv);
  statsIv=setInterval(function(){
    totalSec++;
    if(document.body.classList.contains('looking'))lookSec++;
    updStats();
  },1000);
}

/* ── Stop ── */
function stopTracking(){
  running=false;calibrating=false;
  if(statsIv){clearInterval(statsIv);statsIv=null}
  var s=vid.srcObject;if(s)s.getTracks().forEach(function(t){t.stop()});
  vid.srcObject=null;
  c.clearRect(0,0,cvs.width,cvs.height);gd.style.display='none';calOv.classList.add('h');
  ov.classList.remove('h');sp.style.display='none';mt.innerHTML='Нажмите «Начать»';
  noB.style.display='none';recalB.style.display='none';goB.style.display='';
  document.body.className='';bdg.textContent='ОЖИДАНИЕ';log('Стоп');
}

/* ═══ MAIN LOOP ═══ */
function loop(){
  if(!running)return;
  detect();
  requestAnimationFrame(loop);
}

function detect(){
  if(!faceLandmarker||vid.readyState<2)return;

  var now=performance.now();
  if(now-lastTs<80)return; /* ~12 fps max to save CPU */

  var results=faceLandmarker.detectForVideo(vid, now);
  lastTs=now;
  c.clearRect(0,0,cvs.width,cvs.height);

  if(!results.faceLandmarks||results.faceLandmarks.length===0){
    if(calibrating)calSub.textContent='Лицо не найдено…';
    else pushGaze(false);
    return;
  }

  var lm=results.faceLandmarks[0];
  var vw=cvs.width, vh=cvs.height;

  /* ── Draw face mesh (subtle) ── */
  c.fillStyle='rgba(0,230,118,0.25)';
  var keyPts=[IRIS_L,IRIS_R,NOSE_TIP,L_EYE_IN,L_EYE_OUT,R_EYE_IN,R_EYE_OUT,L_EYE_TOP,L_EYE_BOT,R_EYE_TOP,R_EYE_BOT];
  keyPts.forEach(function(i){
    if(lm[i]){c.beginPath();c.arc(lm[i].x*vw,lm[i].y*vh,2,0,Math.PI*2);c.fill()}
  });

  /* ── Draw eye contours ── */
  var leftEyeIdxs=[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246];
  var rightEyeIdxs=[263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466];
  c.strokeStyle='rgba(0,229,255,0.3)';c.lineWidth=1;
  [leftEyeIdxs,rightEyeIdxs].forEach(function(idxs){
    c.beginPath();
    idxs.forEach(function(idx,j){
      var p=lm[idx];
      if(j===0)c.moveTo(p.x*vw,p.y*vh);
      else c.lineTo(p.x*vw,p.y*vh);
    });
    c.closePath();c.stroke();
  });

  /* ── Draw iris circles ── */
  c.fillStyle='rgba(0,229,255,0.6)';
  [IRIS_L,IRIS_R].forEach(function(idx){
    var p=lm[idx];
    c.beginPath();c.arc(p.x*vw,p.y*vh,4,0,Math.PI*2);c.fill();
  });

  /* ── Iris relative positions ── */
  var irisL=irisRelative(lm, IRIS_L, L_EYE_IN, L_EYE_OUT, L_EYE_TOP, L_EYE_BOT);
  var irisR=irisRelative(lm, IRIS_R, R_EYE_IN, R_EYE_OUT, R_EYE_TOP, R_EYE_BOT);

  /* ── EAR (Eye Aspect Ratio) — blink detection ── */
  var earL=eyeAR(lm, L_LID_UP, L_LID_DN, L_EYE_IN, L_EYE_OUT);
  var earR=eyeAR(lm, R_LID_UP, R_LID_DN, R_EYE_IN, R_EYE_OUT);
  var ear=(earL+earR)/2;
  var eyesClosed=ear<0.16;

  /* ── Head pose features (secondary) ── */
  var noseTip=lm[NOSE_TIP];
  var eyeMidX=(lm[IRIS_L].x+lm[IRIS_R].x)/2;
  var noseOff=noseTip.x-eyeMidX;

  var lCheek=lm[L_CHEEK], rCheek=lm[R_CHEEK];
  var dL=Math.hypot(lm[IRIS_L].x-lCheek.x, lm[IRIS_L].y-lCheek.y);
  var dR=Math.hypot(lm[IRIS_R].x-rCheek.x, lm[IRIS_R].y-rCheek.y);
  var earRatio=Math.min(dL,dR)/(Math.max(dL,dR)+.001);

  /* ── Blendshapes for extra eye signals ── */
  var lookDown=0, lookUp=0, lookLeft=0, lookRight=0;
  if(results.faceBlendshapes && results.faceBlendshapes.length>0){
    var bs=results.faceBlendshapes[0].categories;
    for(var i=0;i<bs.length;i++){
      var name=bs[i].categoryName, score=bs[i].score;
      if(name==='eyeLookDownLeft'||name==='eyeLookDownRight')lookDown=Math.max(lookDown,score);
      if(name==='eyeLookUpLeft'||name==='eyeLookUpRight')lookUp=Math.max(lookUp,score);
      if(name==='eyeLookOutLeft'||name==='eyeLookInRight')lookLeft=Math.max(lookLeft,score);
      if(name==='eyeLookInLeft'||name==='eyeLookOutRight')lookRight=Math.max(lookRight,score);
    }
  }

  /* ── Calibration sample ── */
  if(calibrating){
    if(!eyesClosed){
      addCal({ilx:irisL.x,ily:irisL.y,irx:irisR.x,iry:irisR.y,no:noseOff,er:earRatio});
    }
    return;
  }

  /* ── Scoring — heavy focus on iris tracking ── */
  var bILX=baseline.calibrated?baseline.irisLX:0.5;
  var bILY=baseline.calibrated?baseline.irisLY:0.5;
  var bIRX=baseline.calibrated?baseline.irisRX:0.5;
  var bIRY=baseline.calibrated?baseline.irisRY:0.5;
  var bNO=baseline.calibrated?baseline.noseOff:0;
  var bER=baseline.calibrated?baseline.earRatio:1;

  var dILX=Math.abs(irisL.x-bILX);
  var dILY=Math.abs(irisL.y-bILY);
  var dIRX=Math.abs(irisR.x-bIRX);
  var dIRY=Math.abs(irisR.y-bIRY);
  var dNO=Math.abs(noseOff-bNO);
  var dER=Math.abs(earRatio-bER);

  var sens=parseInt(sensE.value), k=0.4+(sens-1)*0.053;

  /* Iris scores (primary — 60% total weight) */
  var sILX=Math.exp(-Math.pow(dILX*k/.15,2));
  var sILY=Math.exp(-Math.pow(dILY*k/.20,2));
  var sIRX=Math.exp(-Math.pow(dIRX*k/.15,2));
  var sIRY=Math.exp(-Math.pow(dIRY*k/.20,2));

  /* Blendshape gaze score (15% weight) */
  var gazeDeviation=Math.max(lookDown,lookLeft,lookRight)*0.8+lookUp*0.3;
  var sBlend=Math.exp(-Math.pow(gazeDeviation*k/.4,2));

  /* Head pose scores (secondary — 15% total weight) */
  var sNO=Math.exp(-Math.pow(dNO*k/.25,2));
  var sER=Math.exp(-Math.pow(dER*k/.35,2));

  /* Face in frame (5%) */
  var faceCX=(lm[NOSE_TIP].x);
  var faceCY=(lm[NOSE_TIP].y);
  var offFrame=Math.max(Math.abs(faceCX-.5),Math.abs(faceCY-.5));
  var sFF=offFrame<.38?1:Math.max(0,1-(offFrame-.38)/.12);

  /* Eyes closed penalty (5%) */
  var sEye=eyesClosed?0:1;

  /* Combined score — iris-dominant */
  var score=sILX*.18+sILY*.12+sIRX*.18+sIRY*.12+sBlend*.15+sNO*.08+sER*.07+sFF*.05+sEye*.05;

  var thr=.35+(sens-1)*.009;
  var looking=score>thr && !eyesClosed;

  if(showDebug){
    dbgP.innerHTML=
      '<b>Score:'+score.toFixed(2)+'/'+thr.toFixed(2)+'</b> '+(looking?'<span style="color:var(--green)">LOOK</span>':'<span style="color:var(--red)">AWAY</span>')+'<br>'+
      'IrisL X:'+irisL.x.toFixed(3)+' b:'+bILX.toFixed(3)+' s:'+sILX.toFixed(2)+'<br>'+
      'IrisL Y:'+irisL.y.toFixed(3)+' b:'+bILY.toFixed(3)+' s:'+sILY.toFixed(2)+'<br>'+
      'IrisR X:'+irisR.x.toFixed(3)+' b:'+bIRX.toFixed(3)+' s:'+sIRX.toFixed(2)+'<br>'+
      'IrisR Y:'+irisR.y.toFixed(3)+' b:'+bIRY.toFixed(3)+' s:'+sIRY.toFixed(2)+'<br>'+
      'Blend: D:'+lookDown.toFixed(2)+' U:'+lookUp.toFixed(2)+' L:'+lookLeft.toFixed(2)+' R:'+lookRight.toFixed(2)+' s:'+sBlend.toFixed(2)+'<br>'+
      'NO:'+noseOff.toFixed(3)+' s:'+sNO.toFixed(2)+' ER:'+earRatio.toFixed(2)+' s:'+sER.toFixed(2)+'<br>'+
      'EAR:'+ear.toFixed(3)+' Closed:'+(eyesClosed?'Y':'N')+' Cal:'+(baseline.calibrated?'Y':'N');
  }
  pushGaze(looking);
}

function pushGaze(l){
  gazeBuf.push(l?1:0);
  if(gazeBuf.length>BUF)gazeBuf.shift();
  var s=0;for(var i=0;i<gazeBuf.length;i++)s+=gazeBuf[i];
  setGaze(s>=3);
}

function setGaze(looking){
  if(looking){
    document.body.className='looking';bdg.textContent='СМОТРИТ';gd.textContent='👁️';
    wasLook=true;beepCD=0;
  }else{
    document.body.className='away';bdg.textContent='ОТВЛЁКСЯ';gd.textContent='⚠️';
    if(wasLook){distN++;wasLook=false}
    var now=Date.now();
    if(now-beepCD>900){beep();beepCD=now}
  }
}

function updStats(){
  var m=Math.floor(lookSec/60),s=lookSec%60;
  document.getElementById('sT').textContent=m+':'+String(s).padStart(2,'0');
  document.getElementById('sD').textContent=distN;
  if(totalSec>0)document.getElementById('sF').textContent=Math.round(lookSec/totalSec*100)+'%';
}

</script>
</body>
